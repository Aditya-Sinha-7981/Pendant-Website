    <rect x="145" y="295" width="10" height="9" rx="2" fill="url(#metal)"/>
    <path fill="url(#metal)" fill-rule="evenodd" d="M86 300 H214 A26 26 0 0 1 240 326 V454 A26 26 0 0 1 214 480 H86 A26 26 0 0 1 60 454 V326 A26 26 0 0 1 86 300 Z M90 318 H210 A12 12 0 0 1 222 330 V450 A12 12 0 0 1 210 462 H90 A12 12 0 0 1 78 450 V330 A12 12 0 0 1 90 318 Z"/>
