<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="600" height="1000">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7c8"/>
      <stop offset="0.26" stop-color="#b8955f"/>
      <stop offset="0.5" stop-color="#f0dcb4"/>
      <stop offset="0.74" stop-color="#7a5a33"/>
      <stop offset="1" stop-color="#d9bf8e"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4326"/>
      <stop offset="1" stop-color="#f3e3c2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.37" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chain-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="chain-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
