<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memory Pendants</title>
  <meta name="description" content="Square memory pendants that keep a place close.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <button type="button" class="theme-toggle" aria-pressed="true" aria-label="Night sky">
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 2.5V5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main>
    <section class="custom_location_picker" aria-labelledby="picker-heading">
      <div class="center-div">
        <div class="content-wrapper">
          <div class="section-header">
            <p class="eyebrow">Memory Pendants</p>
            <h1 id="picker-heading" class="section-heading">Choose a place to keep</h1>
            <p class="description">Four places, each held behind glass in a square locket.</p>
          </div>

          <ul class="location-grid">
            <li>
              <a class="location-card" href="paris.html">
                <span class="card-preview" data-landmark="paris" aria-hidden="true"></span>
                <span class="card-meta">Paris</span>
                <span class="card-title">Eiffel Tower</span>
              </a>
            </li>
            <li>
              <a class="location-card" href="great-wall.html">
                <span class="card-preview" data-landmark="great-wall" aria-hidden="true"></span>
                <span class="card-meta">China</span>
                <span class="card-title">Great Wall</span>
              </a>
            </li>
            <li>
              <a class="location-card" href="taj-mahal.html">
                <span class="card-preview" data-landmark="taj-mahal" aria-hidden="true"></span>
                <span class="card-meta">Agra</span>
                <span class="card-title">Taj Mahal</span>
              </a>
            </li>
            <li>
              <a class="location-card" href="big-ben.html">
                <span class="card-preview" data-landmark="big-ben" aria-hidden="true"></span>
                <span class="card-meta">London</span>
                <span class="card-title">Big Ben</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/landmarks/paris.js"></script>
  <script src="assets/landmarks/great-wall.js"></script>
  <script src="assets/landmarks/taj-mahal.js"></script>
  <script src="assets/landmarks/big-ben.js"></script>
  <script>
    (function () {
      var section = document.querySelector('section.custom_location_picker');
      if (!section) return;
      if (!window.PENDANT_LANDMARKS || !window.DOMParser) return;

      section.querySelectorAll('.card-preview').forEach(function (preview) {
        var markup = window.PENDANT_LANDMARKS[preview.getAttribute('data-landmark')];
        if (!markup) return;

        var svg = new DOMParser().parseFromString(markup, 'image/svg+xml').documentElement;
        if (!svg || svg.nodeName.toLowerCase() !== 'svg') return;

        svg.setAttribute('class', 'landmark-svg');
        svg.setAttribute('focusable', 'false');
        svg.setAttribute('preserveAspectRatio', 'xMidYMax meet');
        preview.appendChild(document.importNode(svg, true));
      });
    })();
  </script>
</body>
</html>
