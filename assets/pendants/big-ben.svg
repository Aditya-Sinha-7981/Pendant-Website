<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="600" height="1000">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf1"/>
      <stop offset="0.26" stop-color="#8e99a3"/>
      <stop offset="0.5" stop-color="#d6dde3"/>
      <stop offset="0.74" stop-color="#4a545d"/>
      <stop offset="1" stop-color="#b6c0c8"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c454d"/>
      <stop offset="1" stop-color="#e3e9ee"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.37" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chain-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="chain-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="url(#chain-fade)"/>
    </mask>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g mask="url(#chain-mask)" fill="none" stroke-linecap="round">
    <path d="M150 276 L96 0 M150 276 L204 0" stroke="#4f5962" stroke-width="3.6" stroke-dasharray="6 3.2"/>
    <path d="M150 276 L96 0 M150 276 L204 0" stroke="#dfe6ec" stroke-width="1.2" stroke-dasharray="6 3.2"/>
  </g>

  <g filter="url(#shadow)">
