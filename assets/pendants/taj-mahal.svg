<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="600" height="1000">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d1"/>
      <stop offset="0.26" stop-color="#d9b25c"/>
      <stop offset="0.5" stop-color="#fbe7b0"/>
      <stop offset="0.74" stop-color="#9c7330"/>
      <stop offset="1" stop-color="#ecd08a"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d5a22"/>
      <stop offset="1" stop-color="#fff1cc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.37" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chain-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="chain-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="url(#chain-fade)"/>
    </mask>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g mask="url(#chain-mask)" fill="none" stroke-linecap="round">
    <path d="M150 276 L96 0 M150 276 L204 0" stroke="#9a7434" stroke-width="3.6" stroke-dasharray="6 3.2"/>
    <path d="M150 276 L96 0 M150 276 L204 0" stroke="#fff0c4" stroke-width="1.2" stroke-dasharray="6 3.2"/>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="150" cy="286" rx="9" ry="13" fill="none" stroke="url(#metal)" stroke-width="4.5"/>
    <rect x="145" y="295" width="10" height="9" rx="2" fill="url(#metal)"/>
    <path fill="url(#metal)" fill-rule="evenodd" d="M86 300 H214 A26 26 0 0 1 240 326 V454 A26 26 0 0 1 214 480 H86 A26 26 0 0 1 60 454 V326 A26 26 0 0 1 86 300 Z M90 318 H210 A12 12 0 0 1 222 330 V450 A12 12 0 0 1 210 462 H90 A12 12 0 0 1 78 450 V330 A12 12 0 0 1 90 318 Z"/>
  </g>

