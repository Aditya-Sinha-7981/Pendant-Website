  <rect x="77" y="317" width="146" height="146" rx="13" fill="none" stroke="url(#lip)" stroke-width="2"/>
  <rect x="60.5" y="300.5" width="179" height="179" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  <rect x="69" y="309" width="162" height="162" rx="18" fill="none" stroke="#fff8e0" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.1 5"/>
  <rect x="78" y="318" width="144" height="144" rx="12" fill="url(#glass)"/>
